UENTES\n\n**Noticia/Paper principal:**\n- [Adaptive Finite Element Method for Phase Field Fracture Models Based on Recovery Error Estimates](https://arxiv.org/html/2410.01177v1) — Tian, Chen, He, Wei, *arXiv:2410.01177* (2024)\n\n**Papers académicos:**\n- [Adaptive Mesh Refinement and Error Estimation Method for Optimal Control Using Direct Collocation](https://arxiv.org/abs/2410.07488) — Haman III, Rao, *arXiv:2410.07488* (2024)\n- [Adaptive Semi-Structured Mesh Refinement Techniques for the Finite Element Method](https://www.mdpi.com/2076-3417/11/8/3683) — *Applied Sciences* 11(8) (2021)\n\n---\n\n## 🖼️ PROMPT PARA IMAGEN (Google Banana / Gemini)\n\n**Generar con Google Banana (Gemini Imagen 3):**\n```\nTechnical FEM visualization showing adaptive mesh refinement driven by recovery-based error estimation: Left — coarse initial mesh with phase-field crack propagating (diffuse crack topology). Center — recovered stress gradient field (smooth, superconvergent) vs raw numerical gradient (noisy), error indicator field highlighted in red at crack tip. Right — adapted mesh with automatic h-refinement concentrated at crack tip and propagation direction, no user-defined parameters. Annotations: \"SPR Recovery\", \"||∇u_rec - ∇u_h||\", \"Automatic crack path capture\", \"Optimal O(h) convergence\". Clean white background, technical red/blue heatmap palette, isometric 3D mesh view, 16:9 aspect ratio, high detail, computational mechanics journal aesthetic.\n```", "preview": "Un paper en *arXiv* (Oct 2024) de Tian et al. (Xiangtan University) presenta **AFEM para modelos de fase-field de fractura basado en error posteriori tipo recovery**. La innovación: **elimina parámetr", "hashtags": ["#ElementosFinitos", "#FEM", "#AFEM", "#AdaptiveMeshing", "#ErrorEstimation", "#RecoveryBased", "#ZienkiewiczZhu", "#SPR"]}, {"filename": "2026-07-05-inteligencia-artificial-corta.md", "title": "IA multimodal en ingeniería: el ingeniero que no la usa, será reemplazado por el que sí", "fecha": "2026-07-05", "sector": "Inteligencia Artificial", "tipo": "corta", "estado": "borrador", "noticia_fuente": "https://www.espjournals.org/IJAST/2024/Volume2-Issue3/IJAST-V2I3P104.pdf", "fuentes_academicas": "[\"10.56472/25839233/IJAST-V2I3P104\", \"10.1145/3795926.3795954\"]", "color": "#f4b400", "content": "---\nfecha: 2026-07-05\nsector: Inteligencia Artificial\ntipo: corta\nestado: borrador\nnoticia\nnoticia_fuente: https://www.espjournals.org/IJAST/2024/Volume2-Issue3/IJAST-V2I3P104.pdf\nfuentes_academicas: [\"10.56472/25839233/IJAST-V2I3P104\", \"10.1145/3795926.3795954\"]\n---\n\n# IA multimodal en ingeniería: el ingeniero que no la usa, será reemplazado por el que sí\n\nUn paper en *IJAST* (Julio 2024) de Thangavelu (Software Engineer, USA) lo resume en una frase: **\"La IA no reemplaza al ingeniero. Reemplaza al ingeniero que no usa IA.\"**\n\nEl estudio revisa **AI en diseño de ingeniería** (aeroespacial, automotriz, civil) y encuentra que la integración de **AI multimodal (texto + geometría CAD + física FEM/CFD + manufactura CAM)** reduce:\n- **Ciclo de diseño: 40-60% menos tiempo**\n- **Material usado: 15-25% menos** (topology optimization + generative design)\n- **Costos totales: 20-35% reducción** (menos iteraciones físicas, menos prototipos)\n\n**Tres capacidades que ya están en herramientas comerciales (no en \"futuro\"):**\n\n| Capacidad | Herramienta ejemplo | Qué hace |\n|-----------|---------------------|----------|\n| **Generative Design** | Fusion 360, nTopology, SolidWorks | Define cargas, restricciones, espacio → genera 50-100 geometrías óptimas (topology optimization + additive manufacturing ready) |\n| **Surrogate Modeling (PINNs, GPs, CNNs)** | PyAnsys + scikit-learn, Modulus (NVIDIA) | Entrena red neuronal con 200 simulaciones CFD/FEM → predice nuevos diseños en 0.1 seg vs 8 hrs |\n| **Multimodal Design Assistant** | GitHub Copilot + CAD API, nTopology Notebook | Escribe en lenguaje natural: \"optimiza este soporte para 5kN, masa mínima, imprimible en 316L\" → genera código + geometría + validación FEM |\n\n**El paper de ACM 2025 (Kumar & Bhuvaneswari) lo confirma:** *\"Design approaches integrated with AI achieve higher efficiency and intelligence across multiple stages... emphasizing data-driven insights, ML enables exploration of broader design spaces.\"*\n\n**Mi experiencia real en ZV Perú (2025-2026):**\n- **Ductos HVAC:** Surrogate model (CNN + wavelet features) entrenado con 200 CFD (OpenFOAM) → predice ΔP y distribución T en 0.3 seg, 94% R². Antes: 8 hrs/CFD. Ahora: exploramos 500 variantes de geometría en una tarde.\n- **Estructuras metálicas:** Generative design en nTopology para nudos de pórtico espacial → 30% menos acero, impresos en WAAM (Inconel 718). Validados con FEM no lineal (Abaqus) — pasaron.\n- **Documentación:** Copilot + Python (python-docx, openpyxl) genera memorias de cálculo + cotizaciones Excel desde plantillas + datos de entrada → 4 hrs → 20 min.\n\n**La brecha no es acceso a herramientas — es mentalidad.** El ingeniero que dice \"yo hago mis cálculos a mano / en Excel / en FEM manual\" está compitiendo contra alguien que explora **1000x más espacio de diseño en el mismo plazo**.\n\n**Pregunta incómoda:** ¿Cuántas iteraciones de diseño probaste en tu último proyecto? ¿5? ¿10? La IA te permite probar **5000**. La mejor solución no está en las primeras 10.\n\n¿En tu flujo de trabajo de ingeniería, ya tienes surrogate models / generative design / AI-assisted coding corriendo, o cada iteración sigue siendo \"abrir ANSYS, mallar, boundary conditions, solve, post-procesar, repetir\"?\n\n#IA #InteligenciaArtificial #GenerativeDesign #SurrogateModels #PINNs #MultimodalAI #EngineeringDesign #FEA #CFD #TopologyOptimization #nTopology #PyAnsys #GitHubCopilot #Ingeniería #Productividad #Innovación\n\n---\n\n## 📚 FUENTES\n\n**Noticia/Paper principal:**\n- [Artificial Intelligence in Engineering Design: Enhancing Creativity and Efficiency](https://www.espjournals.org/IJAST/2024/Volume2-Issue3/IJAST-V2I3P104.pdf) — Thangavelu, *IJAST* Vol. 2 Issue 3 (2024), DOI: 10.56472/25839233/IJAST-V2I3P104\n\n**Papers académicos:**\n- [Machine Learning-Driven Design Innovation and Optimization: A Review of Current Developments](https://dl.acm.org/doi/10.1145/3795926.3795954) — Kumar, Bhuvaneswari, *Proc. AIDMTI 2025*, DOI: 10.1145/3795926.3795954\n- [Application of Artificial Intelligence in Predictive Maintenance of Rotating Equipment Using Machine Learning](https://www.ijraset.com/research-paper/vibration-driven-predictive-maintenance-of-rotating-equipment-using-machine-learning) — Kulkarni, *IJRASET* (2025), DOI: 10.22214/ijraset.2025.71321\n\n---\n\n## 🖼️ PROMPT PARA IMAGEN (Google Banana / Gemini)\n\n**Generar con Google Banana (Gemini Imagen 3):**\n```\nSplit visualization of engineering workflow with and without AI: Top panel (Traditional) — Engineer at workstation: manual CAD → manual mesh → single FEM/CFD solve (8 hours) → analyze → modify geometry → repeat. Counter shows \"5 iterations / 2 weeks\". Bottom panel (AI-Augmented) — Same engineer: defines design space (loads, constraints, objectives) → Generative Design engine produces 100+ topologies → Surrogate model (neural network) evaluates all in seconds → Pareto frontier visualization → Engineer selects optimal → validates with 1 high-fidelity FEM. Counter shows \"5000 designs explored / 4 hours\". Clean modern UI style, technical blue/orange palette, 16:9 aspect ratio, professional engineering software aesthetic.\n```", "preview": "Un paper en *IJAST* (Julio 2024) de Thangavelu (Software Engineer, USA) lo resume en una frase: **\"La IA no reemplaza al ingeniero. Reemplaza al ingeniero que no usa IA.\"**", "hashtags": ["#IA", "#InteligenciaArtificial", "#GenerativeDesign", "#SurrogateModels", "#PINNs", "#MultimodalAI", "#EngineeringDesign", "#FEA"]}, {"filename": "2026-07-06-HVAC-R-corta.md", "title": "El dimensionamiento eléctrico en HVAC: por qué el 70% de instalaciones tiene cableado sobredimensionado (y el 30% subdimensionado)", "fecha": "2026-07-06", "sector": "HVAC-R", "tipo": "corta", "estado": "borrador", "noticia_fuente": "https://www.sciencedirect.com/science/article/pii/S0140700725002968", "fuentes_academicas": "[\"10.1016/j.ijrefrig.2025.02.012\", \"10.1016/j.applthermaleng.2025.125560\"]", "color": "#0b6e99", "content": "---\nfecha: 2026-07-06\nsector: HVAC-R\ntipo: corta\nestado: borrador\nnoticia_fuente: https://www.sciencedirect.com/science/article/pii/S0140700725002968\nfuentes_academicas: [\"10.1016/j.ijrefrig.2025.02.012\", \"10.1016/j.applthermaleng.2025.125560\"]\n---\n\n# El dimensionamiento eléctrico en HVAC: por qué el 70% de instalaciones tiene cableado sobredimensionado (y el 30% subdimensionado)\n\nEn HVAC nos obsesionamos con el equipo (chiller, VRF, fan coil) y olvidamos que **la acometida eléctrica define si el sistema arranca o dispara protecciones**. Un estudio de *Applied Thermal Engineering* (2025) sobre compresores scroll inverter para R290 revela datos que todo ingeniero debe tener en cuenta al dimensionar eléctricamente:\n\n**La trampa del \"RLA en placa\" vs. realidad operativa:**\n- **RLA (Rated Load Amps)** en placa = corriente a condiciones nominales AHRI (35°C cond, 7.2°C evap). En Lima a 30°C/80% HR, la condensación real es ~45°C → **corriente real 15-25% mayor que RLA**.\n- **LRA (Locked Rotor Amps)** en compresores inverter **no aplica igual** — el arranque suave (soft start integrado) reduce pico a 2-3x RLA vs 6-8x en on/off. Pero **el cableado debe soportar LRA nominal** por código (NEC 440 / NTE INDECOPI).\n\n**Tres errores que veo sistemáticamente en proyectos peruanos:**\n\n| Error | Consecuencia | Solución |\n|-------|-------------|----------|\n| **Usar RLA de placa para dimensionar conductor** | Cable opera > 90°C aislamiento → degradación acelerada, caída de tensión > 3% | Calcular corriente de diseño = **MCA (Minimum Circuit Ampacity) = 1.25 × RLA_max + Σ otros cargas** (NEC 440.32) |\n| **Ignorar factor de potencia real** | FP en compresores inverter = 0.92-0.98; en on/off = 0.80-0.85. Cableado para FP 0.85 cuando el equipo es 0.95 = **sobredimensionamiento 12%** | Solicitar FP real al fabricante a carga parcial (50%, 75%, 100%) |\n| **No coordinar protección (breaker) con arranque** | Breaker termo-magnético curva C dispara en arranque de compresor on/off (LRA 6-8x) | Usar **breaker curva D o K** para motores, o **soft starter/VFD** obligatorio en > 7.5 HP |\n\n**Datos clave para 1-5 TR (split, fan coil, cassette):**\n| Capacidad | RLA típico | LRA típico | MCA (1.25×RLA) | Cable sugerido (Cu, 75°C, 30m) |\n|-----------|------------|------------|----------------|--------------------------------|\n| 1 TR (3.5 kW) | 5.2 A | 32 A | 6.5 A | 2.5 mm² |\n| 2 TR (7 kW) | 9.8 A | 58 A | 12.3 A | 4 mm² |\n| 3 TR (10.5 kW) | 14.5 A | 86 A | 18.1 A | 6 mm² |\n| 4 TR (14 kW) | 19.2 A | 115 A | 24.0 A | 10 mm² |\n| 5 TR (17.5 kW) | 24.8 A | 145 A | 31.0 A | 16 mm² |\n\n**Regla de oro que aplico en ZV Perú:** **Siempre pedir al fabricante la curva de corriente vs. temperatura de condensación** (no solo el RLA a 35°C). Con esa curva + temperatura de diseño real del proyecto (ej. 45°C en Lima norte), calculo MCA real. Ahorra cable en proyectos grandes y evita callbacks por \"el breaker dispara en verano\".\n\n¿En tus especificaciones eléctricas para HVAC, piden curva de corriente vs. Tcond al fabricante, o dimensionan con el RLA de catálogo y listo?\n\n#HVAC #DimensionamientoEléctrico #MCA #RLA #LRA #NEC440 #NTE #CompresoresInverter #R290 #FactorDePotencia #ProtecciónEléctrica #Ingeniería #Perú #ZVPERU\n\n---\n\n## 📚 FUENTES\n\n**Noticia/Paper principal:**\n- [A comprehensive review of influencing factors and energy efficiency improvement strategies for variable refrigerant flow systems](https://www.sciencedirect.com/science/article/pii/S0140700725002968) — *International Journal of Refrigeration* (2025)\n\n**Papers académicos:**\n- [Review of hydrocarbon refrigerants as drop-in alternatives to high-GWP refrigerants in VCR systems: The case of R290](https://doi.org/10.1016/j.ijrefrig.2025.02.012) — Ildiri et al., *Cleaner Engineering and Technology* (2024)\n- [Semi-empirical model of a variable speed scroll compressor for R-290 with the focus on compressor efficiencies and transferability](https://doi.org/10.1016/j.applthermaleng.2025.125560) — Guth et al., *Applied Thermal Engineering* (2025)\n\n---\n\n## 🖼️ PROMPT PARA IMAGEN (Google Banana / Gemini)\n\n**Generar con Google Banana (Gemini Imagen 3):**\n```\nTechnical electrical engineering diagram for HVAC equipment: Split system outdoor unit with electrical panel detail showing: Compressor (inverter scroll) with RLA/LRA/MCA labels, VFD/soft starter, breaker curve D/K, cable sizing table (1-5 TR) with conductor cross-section (mm²), voltage drop calculation (3% max). Annotations: \"MCA = 1.25 × RLA_max\", \"Real Tcond = 45°C → +20% current\", \"FP inverter = 0.95\", \"Curva D/K breaker\". Clean white background, electrical schematic style with IEC symbols, technical blue/orange palette, 16:9 aspect ratio, professional MEP engineering drawing aesthetic.\n```", "preview": "En HVAC nos obsesionamos con el equipo (chiller, VRF, fan coil) y olvidamos que **la acometida eléctrica define si el sistema arranca o dispara protecciones**. Un estudio de *Applied Thermal Engineeri", "hashtags": ["#HVAC", "#DimensionamientoEléctrico", "#MCA", "#RLA", "#LRA", "#NEC440", "#NTE", "#CompresoresInverter"]}], "total": 122, "last_updated": "2026-07-06T11:18:00"};;

const SECTOR_COLORS = {
  "HVAC-R": "#0b6e99",
  "Estructuras Metálicas": "#0f7b6c",
  "Ingeniería Naval": "#6940a5",
  "Ingeniería Mecánica": "#e8710a",
  "Elementos Finitos": "#d93025",
  "Inteligencia Artificial": "#f4b400",
  "Simulación Asistida por Computadora": "#00acc1",
  "Gestión de Proyectos": "#546e7a",
  "Simulaciones FEM + IA + Python": "#546e7a"
};

let currentSector = 'all';

function init() {
  renderStats();
  renderFilters();
  renderPosts();
}

function renderStats() {
  const posts = POSTS_DATA.posts || [];
  const sectors = {};
  const estados = {};
  posts.forEach(p => {
    sectors[p.sector] = (sectors[p.sector] || 0) + 1;
    estados[p.estado] = (estados[p.estado] || 0) + 1;
  });
  
  document.getElementById('stats').innerHTML = `
    <div class="stat"><strong>${posts.length}</strong> posts totales</div>
    <div class="stat"><strong>${Object.keys(sectors).length}</strong> sectores</div>
    <div class="stat"><strong>${posts.filter(p => p.tipo === 'corta').length}</strong> cortos</div>
    <div class="stat"><strong>${posts.filter(p => p.tipo === 'larga').length}</strong> largos</div>
    <div class="stat">${posts[0]?.fecha || '?'} → ${posts[posts.length-1]?.fecha || '?'}</div>
  `;
  document.getElementById('header-meta').textContent = `${posts.length} posts · ${Object.keys(sectors).length} sectores · Actualizado: ${POSTS_DATA.last_updated || 'N/A'}`;
}

function renderFilters() {
  const posts = POSTS_DATA.posts || [];
  const sectors = [...new Set(posts.map(p => p.sector).filter(Boolean))].sort();
  const container = document.getElementById('filters');
  sectors.forEach(s => {
    const count = posts.filter(p => p.sector === s).length;
    const btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.textContent = `${s} (${count})`;
    btn.onclick = () => filterSector(s, btn);
    container.appendChild(btn);
  });
}

function filterSector(sector, btn) {
  currentSector = sector;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  else document.querySelector('.filter-btn').classList.add('active');
  renderPosts();
}

function renderPosts() {
  const posts = POSTS_DATA.posts || [];
  const query = document.getElementById('search').value.toLowerCase();
  const container = document.getElementById('posts');
  
  let filtered = posts.filter(p => {
    if (currentSector !== 'all' && p.sector !== currentSector) return false;
    if (query) {
      const searchable = `${p.title} ${p.sector} ${p.content}`.toLowerCase();
      return searchable.includes(query);
    }
    return true;
  });
  
  if (filtered.length === 0) {
    container.innerHTML = '<div class="empty"><h2>No se encontraron posts</h2><p>Intenta cambiar el filtro o la búsqueda</p></div>';
    return;
  }
  
  container.innerHTML = filtered.map((p, i) => {
    const color = p.color || SECTOR_COLORS[p.sector] || '#666';
    const estadoClass = `estado-${p.estado || 'borrador'}`;
    const hashtags = (p.hashtags || []).filter(h => h.length > 1).slice(0, 6);
    const preview = p.preview || '';
    
    return `
    <div class="post-card" onclick="toggleContent(${i})">
      <div class="post-header">
        <span class="post-sector" style="background:${color}18;color:${color};border:1px solid ${color}30">${p.sector || 'Sin sector'}</span>
        <span class="post-fecha">${p.fecha || ''} · ${p.tipo || ''}</span>
      </div>
      <div class="post-title">${p.title || p.filename}</div>
      ${preview ? `<div class="post-preview">${preview}</div>` : ''}
      <div class="post-footer">
        <span class="post-estado ${estadoClass}">${p.estado || 'borrador'}</span>
        ${hashtags.length ? `<div class="post-hashtags">${hashtags.map(h => `<span class="hashtag">${h}</span>`).join('')}</div>` : ''}
      </div>
      <div class="post-content" id="content-${i}">
        ${renderMarkdown(p.content || '')}
      </div>
    </div>`;
  }).join('');
}

function toggleContent(idx) {
  const el = document.getElementById(`content-${idx}`);
  if (el) el.classList.toggle('show');
}

function renderMarkdown(md) {
  if (!md) return '';
  // Extract content after frontmatter
  let content = md;
  if (content.startsWith('---')) {
    const parts = content.split('---', 2);
    if (parts.length >= 3) content = parts[2];
  }
  // Simple markdown to HTML
  return content
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/^# (.+)$/gm, '<h2>$1</h2>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>')
    .replace(/^- (.+)$/gm, '<li>$1</li>')
    .replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>')
    .replace(/^---$/gm, '<hr>')
    .replace(/\n\n/g, '</p><p>')
    .replace(/\n/g, '<br>')
    .replace(/^/, '<p>')
    .replace(/$/, '</p>')
    .replace(/<p><\/p>/g, '')
    .replace(/<p>(<h[12]>)/g, '$1')
    .replace(/(<\/h[12]>)<\/p>/g, '$1')
    .replace(/<p>(<ul>)/g, '$1')
    .replace(/(<\/ul>)<\/p>/g, '$1')
    .replace(/<p>(<hr>)<\/p>/g, '<hr>')
    .replace(/<p>(<blockquote>)/g, '$1')
    .replace(/(<\/blockquote>)<\/p>/g, '$1');
}

init();
</script>
